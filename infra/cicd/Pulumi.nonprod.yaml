config:
  aws:region: us-east-1
  # appName, repoOwner, repoName, targetStack, connectionProvider and
  # requireApproval all default to these nonprod values in index.ts:
  #   chatflow-nonprod / rohitahuja1 / chatflow / nonprod / Bitbucket / false
  # They are restated here so the stack is readable without opening the code.
  chatbot-cicd:appName: chatflow-nonprod
  chatbot-cicd:repoOwner: rohitahuja1
  chatbot-cicd:repoName: chatflow
  chatbot-cicd:branchName: main
  chatbot-cicd:targetStack: nonprod
  chatbot-cicd:connectionProvider: Bitbucket
  chatbot-cicd:requireApproval: "true"
  # A full run takes ~58 min (three cold image builds; CodeBuild has no cache
  # between runs). 90 left too little margin.
  chatbot-cicd:deployTimeout: "120"
  # Set this to an already-authorized CodeStar connection ARN to reuse it. If left
  # unset, Pulumi creates a new connection in PENDING state, which must be
  # authorized once in the AWS console before the pipeline can read the repo.
  # chatbot-cicd:connectionArn: arn:aws:codeconnections:us-east-1:970547372609:connection/xxxx
encryptionsalt: v1:+2lu/GYKJ7U=:v1:ipol3zEzPNgGiEVb:0XJqpkUPWl9IzTBLiz8ZgU/VTgfmFw==
