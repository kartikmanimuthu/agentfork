config:
  aws:region: us-east-1
  # Defaults in index.ts are nonprod, so prod must state every value explicitly.
  # These are exactly what this pipeline already ran with before it was parameterised.
  chatbot-cicd:appName: chatbot
  chatbot-cicd:repoOwner: kartikmanimuthu
  chatbot-cicd:repoName: chatbot
  chatbot-cicd:branchName: main
  chatbot-cicd:targetStack: prod
  chatbot-cicd:connectionProvider: GitHub
  chatbot-cicd:requireApproval: "true"
  chatbot-cicd:deployTimeout: "60"
  # index.ts refuses to run this stack unless allowProd is true. Leave it unset so an
  # accidental `pulumi up --stack prod` fails immediately instead of renaming (i.e.
  # destroying and recreating) the live prod pipeline.
  # chatbot-cicd:allowProd: "true"

  chatbot-cicd:allowProd: "true"
