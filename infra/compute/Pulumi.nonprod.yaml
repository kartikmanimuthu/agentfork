  # required for it to change how it behaves when asked. Under 'user' those three are
  # denied outright at the backend and Claw answered "you are not permitted to edit
  # soul". Under 'all' they are also pre-granted (file-tools.ts), so an asked-for
  # persona edit lands without an approval modal; churn is bounded by
